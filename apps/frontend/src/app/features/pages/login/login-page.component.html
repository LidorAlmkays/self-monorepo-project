<ng-container *ngIf="loginStoreVm$ | async as loginStoreVm">
  <p-card>
    <h1 class="text-center font-bold underline font-italic">Login</h1>
    <app-basic-form
      class="flex flex-wrap align-items-center justify-content-center"
      [formFields]="formFields"
      [isLoading]="loginStoreVm.isLoading"
      (onSubmit)="onSubmit($event)"
    ></app-basic-form>
  </p-card>
</ng-container>
