<ng-container
  *ngIf="downloadYoutubeVideoStoreVm$ | async as downloadYoutubeVideoStoreVm"
>
  <p-card>
    <h1 class="text-center font-bold underline font-italic">Login</h1>
    <app-basic-form
      class="flex flex-wrap align-items-center justify-content-center"
      [formFields]="formFields"
      [isLoading]="downloadYoutubeVideoStoreVm.isLoading"
      (onSubmit)="onSubmit($event)"
    ></app-basic-form>
  </p-card>
</ng-container>
